apiVersion: apps/v1
kind: Deployment
metadata:
  name: php
spec:
  replicas: 1
  selector:
    matchLabels:
      app: php
  template:
    metadata:
      labels:
        app: php
    spec:
      containers:
      - name: php
        image: polyglot-php:latest
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: php
spec:
  type: NodePort
  selector:
    app: php
  ports:
  - port: 80
    nodePort: 30081